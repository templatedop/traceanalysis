---
apiVersion: v1
kind: Namespace
metadata:
  name: observability-analysis

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-analysis-config
  namespace: observability-analysis
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: 30s
      write_timeout: 30s

    temporal:
      host_port: "temporal-frontend.temporal:7233"
      namespace: "default"
      task_queue: "observability-analysis"
      worker_count: 4
      max_concurrent: 10

    llm:
      provider: "ollama"
      default_model: "qwen2.5:32b"
      base_url: "http://ollama.observability-analysis:11434"
      timeout: 5m
      max_retries: 3
      temperature: 0.1
      max_tokens: 4096

    rag:
      vector_store:
        type: "qdrant"
        host: "qdrant.observability-analysis"
        port: 6333
        collection: "observability"
        dimension: 768
      embedding_model: "nomic-embed-text"
      embedding_dim: 768
      chunk_size: 1000
      chunk_overlap: 200
      top_k: 5
      min_score: 0.7
      knowledge_base_path: "/app/knowledge"

    collectors:
      prometheus:
        enabled: true
        url: "http://prometheus.monitoring:9090"
        timeout: 30s
      jaeger:
        enabled: true
        query_url: "http://jaeger-query.tracing:16686"
        timeout: 30s
      loki:
        enabled: true
        url: "http://loki.logging:3100"
        timeout: 30s

    analysis:
      default_time_range: 1h
      max_traces: 1000
      max_logs: 10000
      anomaly_threshold: 3.0

    alerting:
      enabled: true
      slack:
        enabled: false
      pagerduty:
        enabled: false

    logging:
      level: "info"
      format: "json"
      output: "stdout"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-analysis-server
  namespace: observability-analysis
  labels:
    app: observability-analysis
    component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-analysis
      component: server
  template:
    metadata:
      labels:
        app: observability-analysis
        component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: observability-analysis
      containers:
        - name: server
          image: observability-analysis:latest
          imagePullPolicy: Always
          args:
            - "--config=/app/config/config.yaml"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: observability-analysis-secrets
                  key: llm-api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: knowledge
              mountPath: /app/knowledge
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: observability-analysis-config
        - name: knowledge
          persistentVolumeClaim:
            claimName: knowledge-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-analysis-worker
  namespace: observability-analysis
  labels:
    app: observability-analysis
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: observability-analysis
      component: worker
  template:
    metadata:
      labels:
        app: observability-analysis
        component: worker
    spec:
      serviceAccountName: observability-analysis
      containers:
        - name: worker
          image: observability-analysis:latest
          imagePullPolicy: Always
          command: ["worker"]
          args:
            - "--config=/app/config/config.yaml"
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: observability-analysis-secrets
                  key: llm-api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: knowledge
              mountPath: /app/knowledge
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: observability-analysis-config
        - name: knowledge
          persistentVolumeClaim:
            claimName: knowledge-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: observability-analysis
  namespace: observability-analysis
  labels:
    app: observability-analysis
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: observability-analysis
    component: server

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-analysis
  namespace: observability-analysis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-pvc
  namespace: observability-analysis
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: v1
kind: Secret
metadata:
  name: observability-analysis-secrets
  namespace: observability-analysis
type: Opaque
data:
  # Base64 encoded values
  llm-api-key: ""  # Add your API key here

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: observability-analysis-server-hpa
  namespace: observability-analysis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: observability-analysis-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: observability-analysis-worker-hpa
  namespace: observability-analysis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: observability-analysis-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-analysis
  namespace: observability-analysis
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: observability-analysis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: observability-analysis
                port:
                  number: 80
