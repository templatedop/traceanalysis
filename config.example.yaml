# Observability Analysis Framework Configuration
# Copy this file to config.yaml and customize for your environment

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  enable_tls: false
  tls_cert_file: ""
  tls_key_file: ""

# =============================================================================
# FEATURE FLAGS
# Enable/disable major framework features
# =============================================================================
features:
  # Enable Temporal workflow orchestration
  # When disabled, analysis runs synchronously without workflow durability
  enable_temporal: true

  # Enable RAG (Retrieval-Augmented Generation) system
  # When disabled, LLM analysis runs without knowledge base context
  enable_rag: true

  # Enable LLM response caching
  # Reduces costs and latency for repeated queries
  enable_caching: true

  # Enable Prometheus metrics for self-observability
  enable_metrics: true

  # Enable alert notifications (Slack, PagerDuty, Webhook)
  enable_alerting: false

  # Enable predictive analysis and forecasting
  enable_predictions: true

# =============================================================================
# TEMPORAL WORKFLOW CONFIGURATION
# Only used when features.enable_temporal is true
# =============================================================================
temporal:
  host_port: "localhost:7233"
  namespace: "default"
  task_queue: "observability-analysis"
  worker_count: 4
  max_concurrent: 10
  workflow_timeout: 10m
  activity_timeout: 5m
  retry_max_attempts: 3
  retry_initial_interval: 1s
  enable_tls: false
  tls_cert_file: ""
  tls_key_file: ""

# =============================================================================
# LLM CONFIGURATION
# =============================================================================
llm:
  # Provider: ollama, openai, anthropic, deepseek
  provider: "ollama"
  default_model: "qwen2.5:32b"
  base_url: "http://localhost:11434"
  api_key: ""  # Set via LLM_API_KEY environment variable
  timeout: 5m
  max_retries: 3
  temperature: 0.1
  max_tokens: 4096
  rate_limit_rpm: 60

  # Multiple model configurations for different use cases
  models:
    - name: "fast"
      provider: "ollama"
      model: "qwen2.5:7b"
      base_url: "http://localhost:11434"
      temperature: 0.1
      max_tokens: 2048
      use_cases: ["quick_analysis"]

    - name: "detailed"
      provider: "ollama"
      model: "qwen2.5:32b"
      base_url: "http://localhost:11434"
      temperature: 0.1
      max_tokens: 8192
      use_cases: ["trace", "metric", "log", "incident"]

    - name: "reasoning"
      provider: "deepseek"
      model: "deepseek-reasoner"
      base_url: "https://api.deepseek.com"
      temperature: 0.0
      max_tokens: 16384
      use_cases: ["root_cause", "prediction"]

# =============================================================================
# RAG CONFIGURATION
# Only used when features.enable_rag is true
# =============================================================================
rag:
  vector_store:
    # Type: memory, qdrant, weaviate, pinecone, pgvector
    type: "memory"
    host: "localhost"
    port: 6333
    collection: "observability"
    api_key: ""
    dimension: 768

  # Embedding configuration
  embedding_model: "nomic-embed-text"
  embedding_provider: "ollama"  # ollama, openai
  embedding_dim: 768

  # Chunking configuration
  chunk_size: 1000
  chunk_overlap: 200

  # Query configuration
  top_k: 5
  min_score: 0.7

  # Knowledge base
  knowledge_base_path: "./knowledge"
  auto_sync: true
  sync_interval: 5m
  index_on_startup: true

# =============================================================================
# CACHING CONFIGURATION
# Only used when features.enable_caching is true
# =============================================================================
caching:
  max_entries: 1000
  ttl: 1h
  cleanup_interval: 5m

# =============================================================================
# AGENTS CONFIGURATION
# Enable/disable and configure individual analysis agents
# =============================================================================
agents:
  trace:
    enabled: true
    timeout: 2m
    max_retries: 3
    model: ""  # Empty uses default LLM model
    concurrency: 5

  metric:
    enabled: true
    timeout: 2m
    max_retries: 3
    model: ""
    concurrency: 5

  log:
    enabled: true
    timeout: 2m
    max_retries: 3
    model: ""
    concurrency: 5

# =============================================================================
# COLLECTORS CONFIGURATION
# Configure data sources for observability data
# =============================================================================
collectors:
  prometheus:
    enabled: true
    url: "http://localhost:9090"
    timeout: 30s
    username: ""
    password: ""

  jaeger:
    enabled: true
    query_url: "http://localhost:16686"
    grpc_address: ""
    timeout: 30s

  tempo:
    enabled: false
    url: ""
    grpc_address: ""
    timeout: 30s

  loki:
    enabled: true
    url: "http://localhost:3100"
    timeout: 30s
    username: ""
    password: ""

  otel:
    enabled: false
    grpc_endpoint: ""
    http_endpoint: ""

# =============================================================================
# ANALYSIS CONFIGURATION
# =============================================================================
analysis:
  default_time_range: 1h
  max_traces: 1000
  max_logs: 10000
  anomaly_threshold: 3.0  # Z-score threshold for anomaly detection

  forecasting:
    enabled: true
    horizon: 24h
    min_data_points: 100
    confidence_level: 0.95

# =============================================================================
# ALERTING CONFIGURATION
# Only used when features.enable_alerting is true
# =============================================================================
alerting:
  enabled: false

  slack:
    enabled: false
    webhook_url: ""  # Set via SLACK_WEBHOOK_URL environment variable
    channel: "#alerts"

  pagerduty:
    enabled: false
    routing_key: ""  # Set via PAGERDUTY_ROUTING_KEY environment variable
    service_key: ""

  webhook:
    enabled: false
    url: ""
    headers:
      Authorization: "Bearer ${WEBHOOK_TOKEN}"

# =============================================================================
# METRICS CONFIGURATION (Self-observability)
# Only used when features.enable_metrics is true
# =============================================================================
metrics:
  path: "/metrics"
  namespace: "observability_analysis"
  subsystem: "framework"

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level: "info"    # debug, info, warn, error
  format: "json"   # json, text
  output: "stdout" # stdout, file
  file: ""         # Log file path when output is "file"

# =============================================================================
# ENVIRONMENT VARIABLE OVERRIDES
# The following environment variables can override config values:
#
# LLM_API_KEY      - Override llm.api_key
# LLM_BASE_URL     - Override llm.base_url
# LLM_MODEL        - Override llm.default_model
# TEMPORAL_HOST    - Override temporal.host_port
# PROMETHEUS_URL   - Override collectors.prometheus.url
# JAEGER_URL       - Override collectors.jaeger.query_url
# LOKI_URL         - Override collectors.loki.url
# =============================================================================
