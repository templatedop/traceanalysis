{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observability-analysis.fullname" . }}-secrets
  namespace: {{ include "observability-analysis.namespace" . }}
  labels:
    {{- include "observability-analysis.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.secrets.llmApiKey }}
  llm-api-key: {{ .Values.secrets.llmApiKey | b64enc | quote }}
  {{- else }}
  llm-api-key: ""
  {{- end }}
{{- end }}
